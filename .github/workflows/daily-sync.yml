name: TikTok Daily Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Fetch TikTok Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run TikTok sync script
        run: python fetch_tiktok.py

      - name: Commit updated data.json
        run: |
          git config user.name  "Hack Rebel Bot"
          git config user.email "bot@hackrebel.social"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: daily TikTok sync $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
